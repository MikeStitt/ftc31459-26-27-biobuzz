# Every push: the tests, and the guide.
#
# The guide is generated from two branches -- the lessons line it sits on, and
# the solutions line it reads the answers from. CI works out the pair from the
# branch name: a branch starting with `lessons` pairs with the same name under
# `solutions`, and any other branch pairs with itself plus `-solutions`. When
# that branch does not exist, the checks that need the pair are skipped and the
# ones that do not still run.
name: CI

on: push

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # local.properties is gitignored, so the SDK path has to be written here.
      # Forward slashes, because a properties file reads a backslash as an escape.
      - name: Point the build at the runner's Android SDK
        shell: bash
        run: echo "sdk.dir=${ANDROID_SDK_ROOT//\\//}" > local.properties

      # Everything except the lessons package. On the lessons line a blank and a
      # regression look the same, which is why the lessons are a task of their own.
      - name: Tests
        shell: bash
        run: ./gradlew --no-daemon :TeamCode:test

  solutions-tests:
    name: lessons suite against the solutions (${{ matrix.os }})
    if: contains(github.ref_name, 'solutions')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Point the build at the runner's Android SDK
        shell: bash
        run: echo "sdk.dir=${ANDROID_SDK_ROOT//\\//}" > local.properties

      # On a solutions branch every blank is filled, so the whole lessons suite
      # has to pass. This is the check the lessons line cannot make.
      - name: Lessons suite
        shell: bash
        run: ./gradlew --no-daemon :TeamCode:testLessons

  docs:
    name: guide (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ninja from PyPI rather than a package manager, so one line serves all
      # three runners.
      - name: Tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja -r book/requirements.txt

      - name: Work out the paired solutions branch
        id: pair
        shell: bash
        run: |
          branch='${{ github.ref_name }}'
          case "$branch" in
            lessons*) pair="solutions${branch#lessons}" ;;
            *)        pair="$branch-solutions" ;;
          esac
          if git ls-remote --exit-code --heads origin "$pair" >/dev/null 2>&1; then
            git fetch --depth=1 origin "+refs/heads/$pair:refs/heads/$pair"
            echo "pair=$pair" >> "$GITHUB_OUTPUT"
            echo "Paired with $pair."
          else
            echo "pair=" >> "$GITHUB_OUTPUT"
            echo "No branch called $pair. The checks that need a pair will be skipped."
          fi

      # The checks that do not need the solutions line. Named one by one rather
      # than as `ninja book`, so the pairing check can be left out. Anything added
      # to the guide that needs no pairing belongs on this line.
      - name: Checks that need no pairing
        shell: bash
        working-directory: book
        run: >
          ninja check-sphinx check-wrap check-reading check-keep check-words
          check-figures check-cheatsheet

      # The answer pages are the only thing generated from both lines today.
      - name: Checks that need the pair
        if: steps.pair.outputs.pair != ''
        shell: bash
        working-directory: book
        env:
          PYTHONPATH: tools
        run: python tools/answers.py --check --solutions '${{ steps.pair.outputs.pair }}'

      - name: Skipped, no pair
        if: steps.pair.outputs.pair == ''
        shell: bash
        run: echo "No paired solutions branch, so the answer pages were not checked."
