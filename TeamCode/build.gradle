// Sloth's Load plugin. Adds the `deploySloth` and `removeSlothRemote` Gradle
// tasks and wires `removeSlothRemote` into installDebug/installRelease so a
// normal Studio install clears any staged hot-reload jar first.
// Keep this version in lockstep with the Sloth runtime dependency below.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url = "https://repo.dairy.foundation/releases" }
    }
    dependencies {
        classpath 'dev.frozenmilk:Load:0.3.2'
    }
}

apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
// Must come AFTER build.common.gradle applies the Android application plugin.
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    // Panels pulls Material Components, which must be compiled against API 34.
    // build.common.gradle sets compileSdkVersion 30; override here rather than
    // editing the shared file, so SDK updates merge cleanly.
    compileSdk 34

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
    testOptions {
        // Android classes are empty stubs in JVM tests and throw unless this is set
        unitTests.returnDefaultValues = true
    }
}

repositories {
    maven { url = "https://mymaven.bylazar.com/releases" }   // Panels
    maven { url = "https://repo.dairy.foundation/releases" } // Sloth
    maven { url = "https://frcmaven.wpi.edu/artifactory/release/" } // WPILib ntcore, tests only
}

// NetworkTables for the laptop simulation. 2025.3.2 and not 2026.2.2: the java
// halves are published at 2026.2.2, but every -jni artifact stops at 2025.3.2,
// and the natives are what a server needs. Both halves move together when the
// 2026 natives appear.
def ntcoreVersion = '2025.3.2'

// The natives ship one jar per platform, so the classifier is chosen here.
// Only osxuniversal has been run.
def wpilibClassifier = {
    String os = System.getProperty('os.name').toLowerCase()
    String arch = System.getProperty('os.arch').toLowerCase()
    boolean arm = arch.contains('aarch64') || arch.contains('arm64')
    if (os.contains('mac')) return 'osxuniversal'
    if (os.contains('win')) return arm ? 'windowsarm64' : 'windowsx86-64'
    return arm ? 'linuxarm64' : 'linuxx86-64'
}()

dependencies {
    implementation project(':FtcRobotController')

    // --- Sloth hot reload -------------------------------------------------
    // Deploy with the `deploySloth` Gradle task (see PANELS.md). Only classes
    // under org.firstinspires.ftc.teamcode are hot reloaded.
    implementation 'dev.frozenmilk.sinister:Sloth:0.3.2'

    // --- Panels dashboard -------------------------------------------------
    // Sloth-repackaged build of Panels 1.0.13. The version string is
    // <sloth version>+<panels version>; keep the 0.3.2 halves matching the
    // Load plugin and Sloth runtime above.
    // Reachable at http://192.168.43.1:8001 on robot Wi-Fi.
    implementation 'com.bylazar.sloth:fullpanels:0.3.2+1.0.13'

    // --- Ivy (Pedro's command scheduler) ----------------------------------
    // BOTH artifacts are required: `core` provides Scheduler/Command/Groups,
    // `pedro` provides PedroCommands.follow(). Missing `pedro` is the usual
    // cause of "cannot resolve symbol follow".
    implementation 'com.pedropathing.ivy:core:1.1.1'
    implementation 'com.pedropathing.ivy:pedro:1.1.1'


    // --- corbelsflightlog (WPILOG files for AdvantageScope) ---------------
    // From JitPack, which needs no setup: it builds the tag the first time
    // anyone asks. Note the coordinates are JitPack's, not the library's own:
    // the group is com.github.<owner>.<repo> and the version is the git tag,
    // with its leading v. All four modules publish there as of v0.2.1.
    //
    // To use a locally built copy instead, run ./gradlew publishToMavenLocal in
    // the corbelsflightlog repo and depend on
    // 'io.github.mikestitt:corbelsflightlog-core:<version>' -- its own
    // coordinates, found through mavenLocal().
    implementation 'com.github.MikeStitt.corbelsflightlog:corbelsflightlog-core:v0.2.1'
    implementation 'com.github.MikeStitt.corbelsflightlog:corbelsflightlog-ftc:v0.2.1'
    implementation 'com.github.MikeStitt.corbelsflightlog:corbelsflightlog-pedro:v0.2.1'

    testImplementation 'junit:junit:4.13.2'

    // --- NetworkTables, for the simulation ---------------------------------
    // testImplementation throughout, so none of this can reach the robot.
    // WPILib's published poms carry no dependencies, so wpiutil is named here
    // rather than arriving with ntcore.
    testImplementation "edu.wpi.first.ntcore:ntcore-java:$ntcoreVersion"
    testImplementation "edu.wpi.first.wpiutil:wpiutil-java:$ntcoreVersion"
    testImplementation "edu.wpi.first.ntcore:ntcore-jni:$ntcoreVersion:$wpilibClassifier"
    testImplementation "edu.wpi.first.wpiutil:wpiutil-jni:$ntcoreVersion:$wpilibClassifier"
}
