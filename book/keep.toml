# The two lines the answers are generated from. A blank commit is the normal
# state: the tool then reads the ref beside it, so running it by hand diffs the
# tips rather than asking anyone to paste a hash. Put a commit in to freeze a
# regeneration deliberately.
#
# lessons is HEAD because the tool is run from the lessons line. This file is
# byte-identical on the solutions line, where running it fails on the TODO guard
# in tools/answers.py rather than writing empty pages.
[answers]
lessons = "HEAD"
lessons_commit = ""
solutions = "solutions-sim-gamepad"
solutions_commit = ""
